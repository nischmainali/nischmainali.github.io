# Notation register.
#
# One record per symbol that recurs across notes. A record pairs the printed
# form with its gloss, so the macro table in data/math.toml and the words a
# reader needs cannot drift apart. The `notation` shortcode prints a chosen
# subset inside a note; /notation/ prints the whole register.
#
# Add a symbol only after it repeats in real writing, on the same rule the
# macro table follows. `tex` is raw TeX without delimiters; `macro` names the
# local abbreviation when one exists.

[[symbols]]
id = "reals"
group = "sets"
tex = "\\RR^d"
macro = "\\RR"
gloss = "Euclidean space of dimension $d$, the environment a code lives on."

[[symbols]]
id = "field"
group = "processes"
tex = "f \\sim \\GP(0, K)"
macro = "\\GP"
gloss = "A centred Gaussian process with covariance kernel $K$."

[[symbols]]
id = "kernel"
group = "processes"
tex = "K(x, y)"
gloss = "The covariance $\\Cov(f(x), f(y))$ of the field at two locations."

[[symbols]]
id = "correlation-length"
group = "processes"
tex = "\\ell"
gloss = "The correlation length of the field, setting the scale of its features."

[[symbols]]
id = "threshold"
group = "level-sets"
tex = "u"
gloss = "The threshold whose crossings define a place field."

[[symbols]]
id = "excursion"
group = "level-sets"
tex = "A_u(f)"
gloss = "The excursion set $\\{x : f(x) \\geq u\\}$ above the threshold."

[[symbols]]
id = "expectation"
group = "probability"
tex = "\\EE[X]"
macro = "\\EE"
gloss = "Expectation of a random variable."

[[symbols]]
id = "variance"
group = "probability"
tex = "\\Var(X)"
macro = "\\Var"
gloss = "Variance of a random variable."

<h{{ .Level }} id="{{ .Anchor | safeURL }}"{{ with .Attributes.class }} class="{{ delimit . " " }}"{{ end }}>
  {{- if and .Page.IsPage (eq .Page.Section "blog") (ge .Level 2) -}}
  <a class="section-anchor" href="#{{ .Anchor | safeURL }}" aria-label="Permalink to this section"><span aria-hidden="true">§</span></a>
  {{- end -}}
  {{ .Text | safeHTML }}
</h{{ .Level }}>

{{- $id := printf "sidenote-%d" .Ordinal -}}
<input class="sidenote-toggle" type="checkbox" id="{{ $id }}">
<label class="sidenote-ref" for="{{ $id }}" aria-label="Toggle sidenote"><span class="sidenote-ref-number" aria-hidden="true"></span></label>
<span class="sidenote" role="note" aria-label="Sidenote"><span class="sidenote-number" aria-hidden="true"></span>{{ .Inner | markdownify }}</span>

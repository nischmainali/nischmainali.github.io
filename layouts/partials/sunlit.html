{{- $route := "documents" -}}
{{- if .IsHome -}}
  {{- $route = "home" -}}
{{- else if and .IsPage (eq .Section "blog") -}}
  {{- $route = "article" -}}
{{- end -}}

<!--
  Lokta Sunlight: Sunlit's visible physics, rebuilt as one independent surface.
  The static wrapper is a complete fallback; the canvas is progressive decoration.
-->
<div
  id="sunlit-scene"
  data-route="{{ $route }}"
  data-engine-src="{{ partialCached "js-asset-url.html" "js/sunlit-renderer.js" "js/sunlit-renderer.js" }}"
  data-worker-src="{{ partialCached "js-asset-url.html" "js/sunlit-worker.js" "js/sunlit-worker.js" }}"
  aria-hidden="true">
  <canvas id="sunlit-canvas" aria-hidden="true"></canvas>
</div>

</button>

<button id="atmosphere-toggle" type="button" aria-label="Pause atmosphere" aria-pressed="false">

    <svg viewBox="0 0 16 16"><path d="M5 3.25v9.5M11 3.25v9.5"></path></svg>
  </span>
  <span class="atmosphere-play" aria-hidden="true">

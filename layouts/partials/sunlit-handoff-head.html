<script>
  (function () {
    "use strict";

    var root = document.documentElement;

    /* Day or night, decided before anything paints. An explicit choice
     * wins (Shade and Sunset from the earlier design read as day and
     * night); otherwise the light follows the system. A change still in
     * progress from the previous page paints whichever side of the ink's
     * turnover it has reached. */
    var theme = "day";
    try {
      var stored = localStorage.getItem("sunlit-theme");
      if (stored === "night" || stored === "sunset" || stored === "dark") {
        theme = "night";
      } else if (stored !== "day" && stored !== "shade" &&
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        theme = "night";
      }
    } catch (error) {}

    var mode = theme;
    try {
      var change = JSON.parse(sessionStorage.getItem("sunlit-change-v3") || "null");
      if (change) {
        var dir = Number(change.dir) < 0 ? -1 : 1;
        var target = (change.path === "dusk") === (dir > 0) ? "night" : "day";
        var x = Number(change.x0) + dir * (Date.now() - Number(change.startTimeMs)) /
          Math.max(1, Number(change.durationMs) || 1800);
        if (target === theme && x > 0 && x < 1) {
          /* The ink turns over at p = 0.42: x = 0.42 on the way to night,
           * x = 0.3117 on dawn's remapped clock, linear when reduced. */
          var turn = change.path === "dusk" ? 0.42 : (change.reduced ? 0.58 : 0.3117);
          mode = change.path === "dusk" ? (x >= turn ? "night" : "day") : (x <= turn ? "night" : "day");
        }
      }
    } catch (error) {}
    root.setAttribute("data-sunlit-mode", mode);
    var themeColor = document.getElementById("sunlit-theme-color");
    if (themeColor) themeColor.content = themeColor.getAttribute(mode === "night" ? "data-night-color" : "data-day-color");

    var key = "sunlit-handoff-frame-v1";
    var maximumAge = 12 * 60 * 60 * 1000;

    function discard() {
      try { sessionStorage.removeItem(key); } catch (error) {}
    }

    try {
      var source = sessionStorage.getItem(key);
      if (!source) return;
      var frame = JSON.parse(source);
      var ink = root.getAttribute("data-ink") || "lokta-hybrid";
      var width = Math.max(1, window.innerWidth || 1);
      var height = Math.max(1, window.innerHeight || 1);
      var frameWidth = Number(frame && frame.cssWidth);
      var frameHeight = Number(frame && frame.cssHeight);
      var age = Date.now() - Number(frame && (frame.storedAt || frame.capturedAt));
      var dataUrl = frame && typeof frame.dataUrl === "string" ? frame.dataUrl : "";
      var aspectDelta = Math.abs(
        Math.log((width / height) / (frameWidth / frameHeight))
      );

      if (!frame || frame.version !== 2 ||
          frame.theme !== theme || frame.ink !== ink ||
          !(frameWidth > 0) || !(frameHeight > 0) ||
          !(age >= 0 && age <= maximumAge) ||
          aspectDelta > 0.28 ||
          dataUrl.length > 1200000 ||
          dataUrl.indexOf("data:image/") !== 0 ||
          dataUrl.indexOf("\"") !== -1) {
        discard();
        return;
      }

      root.style.setProperty(
        "--sunlit-handoff-frame",
        "url(\"" + dataUrl + "\")"
      );
      root.classList.add("sunlit-has-handoff");
      root.setAttribute("data-sunlit-handoff", "snapshot");
      root.setAttribute("data-sunlit-handoff-theme", theme);
    } catch (error) {
      discard();
    }
  }());
</script>

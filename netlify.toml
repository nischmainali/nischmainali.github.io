[build]
  command = "python3 scripts/check_content.py --source-only && hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"

[context.production.environment]
  HUGO_ENABLEGITINFO = "true"

# These paths are emitted with deterministic content versions by the templates.
# The matching URLs are therefore safe to retain without revalidation.
[[headers]]
  for = "/css/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/custom.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/sunlit.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hugo fingerprints the public ink register stylesheet into this path.
[[headers]]
  for = "/css/ink-register.min.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/article.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/math.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# KaTeX's directory itself carries the pinned release; these files never change
# in place. Asana follows the same versioned vendor-directory convention.
[[headers]]
  for = "/vendor/katex/0.17.0/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/asana-math/000.962/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These locally pinned font files are replaced under a new family/version path,
# never silently overwritten. Let the reading faces survive repeat navigation.
[[headers]]
  for = "/vendor/fonts/linden-hill/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/fonts/jost/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/fonts/eb-garamond-initials/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hugo fingerprints the apparatus register stylesheet into this path.
[[headers]]
  for = "/css/register.min.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

baseurl = "/"
locale = "en-US"
title = "Nisch's homepage"
theme = "hugo-paged"
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents = "↩"

[outputs]
home = ["html", "rss", "json"]

[params]
description = "Nischal's address on the web"
logo = {}

[markup]
[markup.highlight]
codeFences = true
guessSyntax = false
lineNos = false
noClasses = false
tabWidth = 2
[markup.goldmark]
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
[markup.goldmark.renderer]
unsafe = true
